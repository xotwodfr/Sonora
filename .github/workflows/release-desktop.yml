name: Release desktop apps

# Builds the Windows portable .exe and the Linux AppImage and publishes both on one
# GitHub Release. Either push a tag like v0.1.1, or push a branch named release/v0.1.1
# (the workflow then creates the tag itself). "Run workflow" only builds, and keeps the
# files as build artifacts.
on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci
      - name: Build portable .exe
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: desktop/dist/Sonora-*-portable.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci
      - name: Build AppImage
        working-directory: desktop
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: desktop/dist/Sonora-*.AppImage
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Work out the release tag
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then name="${REF#refs/tags/}"; else name="${REF#refs/heads/release/}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Checksums
        working-directory: dist
        run: sha256sum Sonora-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
