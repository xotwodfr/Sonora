name: Release Windows app

# Pushing a tag like v0.1.0 builds the portable .exe on Windows and attaches it
# to a GitHub Release. "Run workflow" builds it too and keeps it as a build artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci

      - name: Build portable .exe
        working-directory: desktop
        run: npm run dist:win

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/dist/Sonora-*-portable.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/Sonora-*-portable.exe
            desktop/dist/Sonora-*-portable.exe.sha256
          generate_release_notes: true

      - name: Keep build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-portable
          path: desktop/dist/Sonora-*-portable.exe
